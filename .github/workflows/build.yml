name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # WPF 와 하드웨어 센서 라이브러리 모두 Windows 전용이라 다른 러너에서는 빌드되지 않는다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # 센서가 필요한 코드는 테스트하지 않는다 — CI 러너에는 읽을 하드웨어가 없다.
      # 요금 계산·에너지 적분·캘리브레이션은 전부 순수 로직이라 여기서 검증된다.
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      # 자체 포함 빌드라 .NET 런타임 설치 없이 실행된다.
      # 압축을 켜면 172MB 가 75MB 로 줄어든다 — 받는 사람 입장에서 차이가 크다.
      - name: Publish single file
        run: >
          dotnet publish src/JuiceBar
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: JuiceBar-win-x64
          path: publish/JuiceBar.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JuiceBar-win-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: JuiceBar.exe
          body: |
            Download `JuiceBar.exe` and run it. No installer, no runtime, no
            administrator rights.

            On Windows 11 the CPU is measured through the Windows energy meter,
            so nothing else is needed. On Windows 10 that meter usually is not
            there — JuiceBar will say so and point you at the
            [PawnIO](https://pawnio.eu/) driver, and until then the CPU share is
            estimated from utilisation with the popup labelling it as such.
